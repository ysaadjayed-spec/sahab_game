<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة جدول الضرب | للبطلة سحاب ☁️✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF7597;
            --secondary: #726AFE;
            --accent: #FFD93D;
            --dark: #2D3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #A8C0FF 0%, #3FA2F6 50%, #8E54E9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 4px solid #FFF;
        }

        h1 {
            color: var(--secondary);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .welcome-msg {
            color: #636e72;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-in-out; }

        /* خريطة المراحل */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .level-btn {
            background: #F8F9FA;
            border: 3px solid var(--secondary);
            border-radius: 20px;
            padding: 12px 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 var(--secondary);
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 var(--secondary);
            background: #F0EDFF;
        }

        .challenge-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, #FF7597, #FF5252);
            color: white;
            border: none;
            font-size: 1.4rem;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 6px 0 #C0392B;
            margin-top: 5px;
            cursor: pointer;
        }

        /* شاشة اللعب */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: bold;
            background: #F0EDFF;
            padding: 12px 25px;
            border-radius: 20px;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .question-box {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--secondary);
            margin: 15px 0;
            letter-spacing: 2px;
        }

        /* شريط التغذية الراجعة والتصحيح */
        .feedback-box {
            min-height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
        }

        .feedback-box.correct {
            visibility: visible;
            background: #E8F8F5;
            color: #27AE60;
        }

        .feedback-box.wrong {
            visibility: visible;
            background: #FDEDEC;
            color: #C0392B;
            animation: shake 0.3s ease-in-out;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #00CEC9;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #00B894;
            transition: all 0.1s;
        }

        .option-btn:hover { background: #00B894; }

        /* الشهادة وجدول الأخطاء */
        .certificate-box {
            border: 8px double #FFD93D;
            background: #FFFDF0;
            padding: 25px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: inset 0 0 15px rgba(255, 217, 61, 0.3);
        }

        .cert-title {
            font-size: 2rem;
            color: #D63031;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .cert-name {
            font-size: 2.2rem;
            color: var(--secondary);
            font-weight: 900;
            border-bottom: 3px dashed #FF7597;
            display: inline-block;
            padding: 0 25px 5px;
            margin: 10px 0;
        }

        .mistakes-container {
            margin-top: 20px;
            text-align: right;
            background: #FFF;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #FF7597;
        }

        .mistakes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .mistakes-table th, .mistakes-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #EEE;
        }

        .action-btn {
            background: #00B894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            margin: 15px 5px 0;
            box-shadow: 0 4px 0 #00876C;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 1. الرئيسية -->
    <div id="home-screen" class="screen active">
        <h1>☁️ مغامرات سحاب في الضرب ☁️</h1>
        <div class="welcome-msg">مرحباً بكِ يا بطلة الرياضيات «سحاب»! اختاري التحدي:</div>
        <div class="levels-grid">
            <button class="level-btn" onclick="startLevel(1)">جدول 1</button>
            <button class="level-btn" onclick="startLevel(2)">جدول 2</button>
            <button class="level-btn" onclick="startLevel(3)">جدول 3</button>
            <button class="level-btn" onclick="startLevel(4)">جدول 4</button>
            <button class="level-btn" onclick="startLevel(5)">جدول 5</button>
            <button class="level-btn" onclick="startLevel(6)">جدول 6</button>
            <button class="level-btn" onclick="startLevel(7)">جدول 7</button>
            <button class="level-btn" onclick="startLevel(8)">جدول 8</button>
            <button class="level-btn" onclick="startLevel(9)">جدول 9</button>
            <button class="level-btn" onclick="startLevel(10)">جدول 10</button>
            <button class="level-btn" onclick="startLevel(11)">جدول 11</button>
            <button class="level-btn" onclick="startLevel(12)">جدول 12</button>
            <button class="level-btn challenge-btn" onclick="startChallenge()">⚡ تحدي سحاب الشامل (45 ثانية) ⚡</button>
        </div>
    </div>

    <!-- 2. اللعب -->
    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <div>النقاط: <span id="score-val" style="color:#00B894;">0</span></div>
            <div id="timer-box">الوقت: <span id="timer-val" style="color:#FF7597;">45</span>s</div>
        </div>
        <div class="question-box" id="question-text">5 × 5 = ?</div>
        <div class="feedback-box" id="feedback-text"></div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 3. الشهادة والنتيجة -->
    <div id="result-screen" class="screen">
        <div class="certificate-box" id="certificate-view">
            <div style="font-size: 3.5rem; margin-bottom: 5px;">👑🏆👑</div>
            <div class="cert-title" id="cert-title-text">شهادة إتقان</div>
            <p style="margin: 5px 0; font-size: 1.1rem;">تمنح هذه الشهادة للفائقة المبدعة:</p>
            <div class="cert-name">سحاب ☁️✨</div>
            <p id="cert-desc-text" style="font-size: 1.2rem; color: #2D3436; margin: 15px 0; line-height: 1.6;"></p>
            
            <!-- مراجعة الأخطاء إن وجدت -->
            <div id="mistakes-section" class="mistakes-container" style="display: none;">
                <h3 style="margin: 0 0 10px 0; color: #E74C3C;">📝 مراجعة الإجابات للمراجعة والتصحيح:</h3>
                <table class="mistakes-table">
                    <thead>
                        <tr>
                            <th>المسألة</th>
                            <th>إجابتكِ</th>
                            <th>الإجابة الصحيحة</th>
                        </tr>
                    </thead>
                    <tbody id="mistakes-list"></tbody>
                </table>
            </div>

            <p style="font-size: 0.95rem; color: #636E72; margin-top: 15px;">التاريخ: <span id="cert-date"></span></p>
        </div>
        <button class="action-btn" onclick="showScreen('home-screen')">القائمة الرئيسية 🏠</button>
        <button class="action-btn" style="background:#726AFE; box-shadow: 0 4px 0 #5146E1;" onclick="window.print()">طباعة الشهادة 🖨️</button>
    </div>
</div>

<script>
    let currentMode = 'level';
    let currentTable = 1;
    let score = 0;
    let timer = 0;
    let timerInterval = null;
    let currentQuestionText = '';
    let currentCorrectAnswer = 0;
    let questionCount = 0;
    let mistakes = []; // تخزين الأخطاء
    let isProcessing = false; // لمنع الضغط المزدوج أثناء تصحيح الإجابة
    const maxQuestionsPerLevel = 10;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function resetFeedback() {
        const fb = document.getElementById('feedback-text');
        fb.className = 'feedback-box';
        fb.innerText = '';
    }

    function startLevel(tableNum) {
        currentMode = 'level';
        currentTable = tableNum;
        score = 0;
        questionCount = 0;
        mistakes = [];
        isProcessing = false;
        document.getElementById('timer-box').style.display = 'none';
        resetFeedback();
        showScreen('game-screen');
        nextLevelQuestion();
    }

    function startChallenge() {
        currentMode = 'challenge';
        score = 0;
        timer = 45;
        mistakes = [];
        isProcessing = false;
        document.getElementById('timer-box').style.display = 'block';
        document.getElementById('timer-val').innerText = timer;
        
        resetFeedback();
        showScreen('game-screen');
        nextChallengeQuestion();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer-val').innerText = timer;
            if (timer <= 0) {
                clearInterval(timerInterval);
                endChallenge();
            }
        }, 1000);
    }

    function nextLevelQuestion() {
        if (questionCount >= maxQuestionsPerLevel) {
            endLevel();
            return;
        }
        questionCount++;
        
        const multiplier = Math.floor(Math.random() * 12) + 1;
        currentCorrectAnswer = currentTable * multiplier;
        currentQuestionText = `${currentTable} × ${multiplier}`;

        document.getElementById('score-val').innerText = `${score} / ${maxQuestionsPerLevel}`;
        document.getElementById('question-text').innerText = `${currentQuestionText} = ?`;

        generateOptions(currentCorrectAnswer);
    }

    function nextChallengeQuestion() {
        const num1 = Math.floor(Math.random() * 12) + 1;
        const num2 = Math.floor(Math.random() * 12) + 1;
        currentCorrectAnswer = num1 * num2;
        currentQuestionText = `${num1} × ${num2}`;

        document.getElementById('score-val').innerText = score;
        document.getElementById('question-text').innerText = `${currentQuestionText} = ?`;

        generateOptions(currentCorrectAnswer);
    }

    function generateOptions(correct) {
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        let options = [correct];
        while (options.length < 4) {
            let wrong = correct + (Math.floor(Math.random() * 10) - 5);
            if (wrong > 0 && !options.includes(wrong)) {
                options.push(wrong);
            }
        }

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedAnswer) {
        if (isProcessing) return;
        isProcessing = true;

        const fb = document.getElementById('feedback-text');
        const isCorrect = (selectedAnswer === currentCorrectAnswer);

        if (isCorrect) {
            score++;
            fb.className = 'feedback-box correct';
            fb.innerText = 'إجابة صحيحة! أحسنتِ يا سحاب 👏✨';
            playBeep(800, 0.1);
        } else {
            fb.className = 'feedback-box wrong';
            fb.innerText = `خطأ ❌ الإجابة الصحيحة لـ (${currentQuestionText}) هي: ${currentCorrectAnswer}`;
            playBeep(250, 0.2);
            
            // تسجيل الخطأ للمراجعة
            mistakes.push({
                q: currentQuestionText,
                userAns: selectedAnswer,
                correctAns: currentCorrectAnswer
            });
        }

        // الانتظار لمشاهدة التصحيح ثم الانتقال للسؤال التالي
        setTimeout(() => {
            resetFeedback();
            isProcessing = false;
            if (currentMode === 'level') {
                nextLevelQuestion();
            } else {
                nextChallengeQuestion();
            }
        }, isCorrect ? 600 : 1800); // إعطاء وقت أطول لقراءة التصحيح إذا كانت الإجابة خاطئة
    }

    function endLevel() {
        if (score >= 8) {
            showCertificate(`جدول العدد (${currentTable})`, `لإتقانها الرائع لجدول الضرب للعدد (${currentTable}) وحصولها على результат ممتاز: ${score} من 10! 👏🎉`);
        } else {
            showCertificate(`جدول العدد (${currentTable}) - المحاولة`, `حصلتِ على ${score} من 10. استمري في التدريب يا سحاب لتحصلي على وسام الإتقان! 💪✨`);
        }
    }

    function endChallenge() {
        showCertificate(`التحدي الشامل ⚡`, `لتفوقها الباهر في تحدي السرعة وحلها (${score}) مسألة ضرب بشكل صحيح خلال 45 ثانية! أنتِ مذهلة يا سحاب! 🚀✨`);
    }

    function showCertificate(title, desc) {
        document.getElementById('cert-title-text').innerText = `وسام إتقان: ${title}`;
        document.getElementById('cert-desc-text').innerText = desc;
        document.getElementById('cert-date').innerText = new Date().toLocaleDateString('ar-EG');

        // عرض جدول الأخطاء إن وجدت
        const mistakesSection = document.getElementById('mistakes-section');
        const mistakesList = document.getElementById('mistakes-list');
        mistakesList.innerHTML = '';

        if (mistakes.length > 0) {
            mistakes.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">${m.q}</td>
                    <td style="color:#C0392B;">${m.userAns}</td>
                    <td style="color:#27AE60; font-weight:bold;">${m.correctAns}</td>
                `;
                mistakesList.appendChild(tr);
            });
            mistakesSection.style.display = 'block';
        } else {
            mistakesSection.style.display = 'none';
        }

        showScreen('result-screen');
    }

    function playBeep(freq, duration) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch(e) {}
    }
</script>

</body>
</html>
